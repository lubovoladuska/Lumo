[project]
name = "lumo"
version = "0.1.0"
description = "Lumo — личный голосовой ИИ-ассистент «Вальтер»"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tzdata>=2024.2",
    "tzlocal>=5.2",
]

[project.optional-dependencies]
core = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.54",
]
desktop = [
    "websockets>=13",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "vosk>=0.3.45",
    "faster-whisper>=1.1",
    "torch>=2.5",
    "silero-vad>=5.1",
    "num2words>=0.5.13",
    "livekit>=1.0",
    "yandex-music>=2.2",
    "aiohttp>=3.9",  # асинхронный клиент yandex-music
    "miniaudio>=1.61",
    "pycaw>=20240316; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "psutil>=6.0",
    "mss>=9.0",
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Playback>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]
desktop-text = [
    "websockets>=13",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[project.scripts]
lumo-core = "lumo.core.__main__:main"
lumo-desktop = "lumo.desktop.__main__:main"
lumo-download-models = "lumo.desktop.download_models:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
