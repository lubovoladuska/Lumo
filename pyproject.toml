[project]
name = "lumo"
version = "0.1.0"
description = "Lumo — личный голосовой ИИ-ассистент «Вальтер»"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
core = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.54",
]
desktop = [
    "websockets>=13",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "vosk>=0.3.45",
    "faster-whisper>=1.1",
    "torch>=2.5",
    "torchaudio>=2.5",
    "omegaconf>=2.3",
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]
desktop-text = [
    "websockets>=13",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[project.scripts]
lumo-core = "lumo.core.__main__:main"
lumo-desktop = "lumo.desktop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
